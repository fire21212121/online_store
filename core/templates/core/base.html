{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'products/css/style.css' %}">
    <title>{% block title %}{% endblock title %} </title>
</head>
<body>
    <div class = "header">
<h1>PythonStyle</h1> 
<img src="{% static 'core/img/logo.png' %}" class="logo">
<div class="buttons">
    <a href="{% url 'catalog' %}" class="button">
    <img src="{% static 'core/img/products.png' %}" class="icon" title = "Каталог">
    </a>
    {% if user.is_authenticated %}
    <a href="{% url 'delivery' %}" class="button">
    <img src="{% static 'core/img/delivery.png' %}" class="icon" title = "Доставка">
    </a>

    <a href="{% url 'cart' %}" class="button">
    <img src="{% static 'core/img/cart.png' %}" class="icon" title = "Корзина">
    </a>

    <a href="{% url 'profile' user.username %}" class="button">
    <img src="{% static 'core/img/profile.png' %}" class="icon" title = "Профиль">
    </a>

    <form class ="logout_form" method = "POST" action = "{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout_button">
            <img src="{% static 'core/img/logout.png' %}" class="logout_icon" title="Выйти">
        </button>
    </form>
    {% else %}
    <a href="{% url 'login' %}" class="button">
    <img src="{% static 'core/img/login.png' %}" class="icon" title = "Войти">
    </a>
    <a href="{% url 'user_registration' %}" class="button">
    <img src="{% static 'core/img/registration.png' %}" class="icon" title = "Зарегистрироваться">
    </a>
    {% endif %}
</div>
  </div>
  {% block content %}
  {% endblock content %}
</body>
</html>
