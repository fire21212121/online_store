{% extends 'core/base.html' %}
{% block title %}
Профиль
{% endblock title %}
{% block content %}
<form method="POST" class="profile_form" enctype="multipart/form-data">
    {% csrf_token %}
<h2>Профиль</h2>
{% if uploaded_image %}
<img src="{{ uploaded_image.url }}">
{% endif %}
{{ user_form }}
{{ form }}
<input type="submit" value="Сохранить" class="button">
<a href = "{% url 'password_change' %}" class = "button">Сменить пароль</a>
</form>
{% endblock content %}
